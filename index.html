<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Нефрит — коллекционные фигурки</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--bg:#111113;--card:#1a1a1e;--line:#2a2a30;--ink:#f5f2eb;--mut:#9b9a96;--gold:#c8a96e;--gold2:#e2c994}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Manrope,sans-serif}
h1,h2,h3,.logo{font-family:"Playfair Display",serif;font-weight:600;margin:0}
button{font:600 15px Manrope,sans-serif;cursor:pointer}:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 5vw;position:sticky;top:0;background:#111113ee;backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px;font-size:22px;text-decoration:none;color:var(--ink)}
.logo i{width:38px;height:38px;border-radius:10px;background:var(--gold);color:#111;display:grid;place-items:center;font-style:normal;font-size:20px}
.pill{border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--mut);font-size:13px}
.cartbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:12px}
.cartbtn b{background:var(--gold);color:#111;padding:1px 8px;margin-left:8px;border-radius:99px}
.wrap{padding:0 5vw}
.hero{margin:32px 0 0;background:radial-gradient(ellipse at 85% 10%,#c8a96e22,transparent 55%),var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(18px,4vw,48px);display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:clamp(24px,5vw,64px);align-items:center}
.frame{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#0c0c0e;position:relative;cursor:pointer}
.frame img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover}
.badge{display:inline-block;border:1px solid var(--gold);color:var(--gold2);border-radius:99px;padding:3px 14px;font-size:13px;margin-bottom:16px}
.frame .badge{position:absolute;top:14px;left:14px;margin:0;background:#111113cc}
.hero h1{font-size:clamp(34px,5vw,60px);line-height:1.1}
.hero h1 em{display:block;color:var(--gold2);font-weight:500}
.hero p{color:var(--mut);max-width:48ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.chips span{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 14px;font-size:14px}
.buyrow{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:24px}
.price{font:600 38px "Playfair Display",serif}
.buy{background:var(--gold);color:#111;border:0;padding:15px 30px;border-radius:14px}.buy:hover{background:var(--gold2)}
.sec{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:64px 0 24px}
.sec h2{font-size:clamp(28px,4vw,40px)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{background:none;border:0;color:var(--mut);padding:9px 20px;border-radius:10px}
.tabs .on{background:var(--gold);color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .2s}
.card:hover{border-color:var(--gold)}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.card div{padding:16px 18px 20px}.card h3{font-size:20px;line-height:1.25}.card small{display:block;color:var(--mut);margin:4px 0 12px}
.card b{font:600 22px "Playfair Display",serif;color:var(--gold2)}
.note{color:var(--mut);font-size:14px;margin:48px 0 80px;max-width:70ch}
.ov{position:fixed;inset:0;background:#000b;display:none;z-index:9;overflow:auto;padding:4vh 4vw}.ov.on{display:block}
.pd{background:var(--card);border:1px solid var(--line);border-radius:24px;max-width:1000px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:28px;position:relative}
.pd .big{width:100%;border-radius:16px;display:block}.th{display:flex;gap:8px;margin-top:10px}
.th img{width:72px;border-radius:10px;cursor:pointer;opacity:.55;border:1px solid var(--line)}.th img.on{opacity:1;border-color:var(--gold)}
.pd h2{font-size:34px}.pd dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;color:var(--mut);margin:18px 0}.pd dd{margin:0;color:var(--ink)}
.x{position:absolute;top:10px;right:16px;background:none;border:0;color:var(--ink);font-size:30px}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--card);z-index:10;padding:28px 24px;overflow:auto;transform:translateX(100%);transition:transform .3s;border-left:1px solid var(--line)}
.drawer.on{transform:none}.drawer h2{font-size:28px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center;margin:12px 0}.row img{width:56px;border-radius:8px}.row p{margin:0;flex:1}
.row button{background:var(--bg);border:1px solid var(--line);color:var(--ink);width:30px;height:30px;border-radius:8px}
form input,form select{width:100%;margin:5px 0;padding:13px 14px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font:inherit;border-radius:12px}
.hp{position:absolute;left:-9999px}.chk{display:flex;gap:8px;font-size:13px;color:var(--mut);margin:10px 0 16px}.chk input{width:auto;margin:3px 0}
form .buy{width:100%}#msg{color:var(--gold2)}.hint{font-size:13px;color:var(--mut);margin:4px 0 8px}
@media(max-width:800px){.hero,.pd{grid-template-columns:1fr}.pill{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header class="top"><a class="logo" href="#"><i>Н</i>Нефрит</a><span class="pill">Доставка по России</span><button id="cartBtn" class="cartbtn">Корзина <b id="cnt">0</b></button></header>
<div class="wrap"><section class="hero" id="hero"></section>
<div class="sec"><h2>Каталог коллекции</h2><nav class="tabs" id="tabs"><button data-c="all" class="on">Все</button><button data-c="genshin">Genshin Impact</button><button data-c="anime">Аниме</button></nav></div>
<div class="grid" id="grid"></div>
<p class="note">Каждую фигурку заказываем специально под вас. Срок доставки 2–4 недели, получение в пункте выдачи: Wildberries, Почта России или 5Post.</p></div>
<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer"><button class="x" id="closeCart" aria-label="Закрыть">×</button><h2>Корзина</h2><div id="items"></div>
<form id="form" hidden><input name="fam" placeholder="Фамилия" autocomplete="family-name" required><input name="name" placeholder="Имя" autocomplete="given-name" required><input name="otch" placeholder="Отчество" required>
<input name="phone" type="tel" placeholder="Телефон" autocomplete="tel" required><input name="email" type="email" placeholder="Email" autocomplete="email" required><input name="tg" placeholder="Telegram (@ник)" required>
<select name="delivery" id="dl" required><option value="">Способ доставки</option><option>Wildberries</option><option>Почта России</option><option>5Post</option></select>
<input name="city" placeholder="Город" required><input name="point" id="point" placeholder="Адрес пункта выдачи" required>
<p class="hint">ФИО пишите полностью и так, как в паспорте: по нему вы получите посылку.</p>
<input name="site" class="hp" tabindex="-1" autocomplete="off">
<label class="chk"><input type="checkbox" required> Согласен на обработку персональных данных</label>
<button class="buy" id="send">Оформить заказ</button><p id="msg" role="status"></p></form></aside>

function grid(c="all"){$("#grid").innerHTML=P.filter(p=>c==="all"||p.cat===c).map(p=>`<article class="card" data-id="${p.id}"><img src="${p.images[0]}" alt="${p.name}"><div><h3>${p.name}</h3><small>${p.series} · ${p.size}</small><b>${R(p.price)}</b></div></article>`).join("")}
function hero(){const h=P.find(p=>p.hero)||P[0];$("#hero").innerHTML=`<div class="frame" data-id="${h.id}"><span class="badge">Хит продаж</span><img src="${h.images[0]}" alt="${h.name}"></div><div><span class="badge">Выбор коллекционеров</span><h1>${h.name}<em>${h.series}</em></h1><p>${h.desc}</p><div class="chips"><span>Высота: ${h.size}</span><span>Без подарочной коробки</span><span>Доставка 2–4 недели</span></div><div class="buyrow"><div class="price">${R(h.price)}</div><button class="buy" data-add="${h.id}">Добавить в корзину</button></div></div>`}
function open_(id){const p=prod(id);$("#ov").innerHTML=`<div class="pd"><button class="x" data-close aria-label="Закрыть">×</button><div><img class="big" id="big" src="${p.images[0]}" alt="${p.name}"><div class="th">${p.images.map((s,i)=>`<img src="${s}" class="${i?"":"on"}" alt="">`).join("")}</div></div><div><h2>${p.name}</h2><span style="color:var(--gold2)">${p.series}</span><dl><dt>Размер</dt><dd>${p.size}</dd><dt>Комплектация</dt><dd>Без подарочной коробки</dd><dt>Доставка</dt><dd>2–4 недели, пункты выдачи</dd></dl><p>${p.desc}</p><div class="buyrow"><div class="price">${R(p.price)}</div><button class="buy" data-add="${p.id}">Добавить в корзину</button></div></div></div>`;$("#ov").classList.add("on")}
function draw(){$("#cnt").textContent=cart.reduce((a,c)=>a+c.q,0);
$("#items").innerHTML=cart.length?cart.map(c=>{const p=prod(c.id);return `<div class="row"><img src="${p.images[0]}" alt=""><p>${p.name}<br><b>${R(p.price*c.q)}</b></p><button data-m="${c.id}">−</button>${c.q}<button data-p="${c.id}">+</button></div>`}).join("")+`<p><b>Итого: ${R(cart.reduce((a,c)=>a+prod(c.id).price*c.q,0))}</b></p>`:"<p>Корзина пуста. Выберите фигурку в каталоге.</p>";
$("#form").hidden=!cart.length}
document.addEventListener("click",e=>{const t=e.target,a=t.closest("[data-add]"),c=t.closest("[data-id]");
if(a){const i=cart.find(x=>x.id===a.dataset.add);i?i.q++:cart.push({id:a.dataset.add,q:1});save();$("#ov").classList.remove("on");$("#drawer").classList.add("on")}
else if(t.dataset.m||t.dataset.p){const i=cart.find(x=>x.id===(t.dataset.m||t.dataset.p));i.q+=t.dataset.p?1:-1;cart=cart.filter(x=>x.q>0);save()}
else if(t.dataset.c){document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b===t));grid(t.dataset.c)}
else if(t.closest(".th")&&t.tagName==="IMG"){$("#big").src=t.src;document.querySelectorAll(".th img").forEach(i=>i.classList.toggle("on",i===t))}
else if(t.hasAttribute("data-close")||t===$("#ov"))$("#ov").classList.remove("on");
else if(c)open_(c.dataset.id)});
$("#cartBtn").onclick=()=>$("#drawer").classList.add("on");$("#closeCart").onclick=()=>$("#drawer").classList.remove("on");
$("#dl").onchange=e=>{$("#point").placeholder=e.target.value==="Почта России"?"Индекс, улица, дом, квартира":"Адрес пункта выдачи"};
$("#form").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),m=$("#msg"),U=window.WORKER_URL;
if(f.site)return;if(!U){m.textContent="Приём заказов ещё не подключён.";return}
$("#send").disabled=true;m.textContent="Отправляем…";
try{const r=await fetch(U,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...f,items:cart.map(c=>({name:prod(c.id).name,q:c.q,price:prod(c.id).price}))})});
if(!r.ok)throw 0;cart=[];save();e.target.reset();m.textContent="Заказ принят. Мы напишем вам в Telegram и пришлём ссылку на оплату."}
catch{m.textContent="Не удалось отправить. Попробуйте ещё раз."}$("#send").disabled=false};
hero();grid();draw();
</script></body></html>
